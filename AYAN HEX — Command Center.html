x.strokeStyle='rgba(57,255,136,.8)';x.beginPath();for(let a=0;a<=6.28;a+=.1){const r=m*.28+Math.sin(a*8+t*4*sp)*4*(1+S.spike);x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,5+Math.sin(t*3)*2,0,6.28);x.fill();for(let i=0;i<14;i++){const a=t*.6*sp+i*.45,r=m*(.5+((i*37)%50)/100);x.fillStyle='rgba(255,255,255,.5)';x.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.6,2,2)}}}
/* RADAR */
function radar(){const c=mk('#c1');if(!c)return;if(!S.tg.length)for(let i=0;i<4;i++)S.tg.push({a:R()*6.28,r:rr(.3,.85),l:pick(['UNKNOWN SIGNAL','UNVERIFIED NODE','REMOTE TRACE','PROTOCOL ALERT']),s:'I',id:eid(),t:Date.now()});let P=[];anim=t=>{const{x,w,h}=c,cx=w/2,cy=h/2,m=Math.min(w,h)/2-14,sw=t*1.6%6.28;x.clearRect(0,0,w,h);x.strokeStyle='rgba(57,255,136,.25)';for(let i=1;i<=4;i++){x.beginPath();x.arc(cx,cy,m*i/4,0,6.28);x.stroke()}x.beginPath();x.moveTo(cx-m,cy);x.lineTo(cx+m,cy);x.moveTo(cx,cy-m);x.lineTo(cx,cy+m);x.stroke();for(let i=0;i<40;i++){x.fillStyle='rgba(193,18,31,'+(.4-i*.01)+')';x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,m,sw-i*.02-.02,sw-i*.02);x.fill()}P=[];S.tg.forEach(g=>{const px=cx+Math.cos(g.a)*g.r*m,py=cy+Math.sin(g.a)*g.r*m,d=((sw-g.a)%6.28+6.28)%6.28,b=Math.max(.25,1-d/6.28),col=g.s==='C'?'255,40,40':g.s==='W'?'255,170,0':'57,255,136';P.push([px,py,g]);x.fillStyle='rgba('+col+','+b+')';x.beginPath();x.arc(px,py,4+(1-b)*3,0,6.28);x.fill();x.strokeStyle='rgba('+col+','+b+')';x.strokeRect(px-9,py-9,18,18);x.font='9px monospace';x.fillText(g.l+' '+(g.a*57|0)+'/'+(g.r*99|0),px+12,py+3)})};c.c.onclick=e=>{const r=c.c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let b=null,bd=40;P.forEach(p=>{const d=Math.hypot(p[0]-mx,p[1]-my);if(d<bd){bd=d;b=p[2]}});if(b){sfx.ping();dp('EVENT ANALYSIS '+b.id,[['CLASS',b.l],['SEVERITY',SV[b.s]],['BEARING',(b.a*57|0)+' DEG'],['RANGE',(b.r*99|0)+' U'],['CONFIDENCE',rr(70,99).toFixed(0)+'%'],['STATUS','TRACKING (SIMULATED)']],'<br><button class="btn" onclick="S.tg=S.tg.filter(q=>q.id!==\''+b.id+'\');emit(\'TARGET NEUTRALIZED IN SIMULATION\',\'I\',\'SECURITY\');cl()">RESOLVE TARGET</button> ')}}}
/* MAP */
function smap(){const c=mk('#c1');if(!c)return;const pk=NODES.map(()=>({p:R(),e:R()*8|0})),pos=[];anim=t=>{const{x,w,h}=c,cx=w/2,cy=h/2,m=Math.min(w,h)/2-40;x.clearRect(0,0,w,h);pos.length=0;NODES.forEach((n,i)=>{const a=i?(i-1)/8*6.28+t*.05:0;pos.push([i?cx+Math.cos(a)*m:cx,i?cy+Math.sin(a)*m:cy])});for(let i=1;i<9;i++){[0,i%8+1].forEach(j=>{x.strokeStyle='rgba(193,18,31,.5)';x.beginPath();x.moveTo(pos[i][0],pos[i][1]);x.lineTo(pos[j][0],pos[j][1]);x.stroke()})}pk.forEach((p,i)=>{p.p=(p.p+.006)%1;const a=pos[p.e+1]||pos[1],b=pos[0];x.fillStyle='#39ff88';x.fillRect(a[0]+(b[0]-a[0])*p.p-2,a[1]+(b[1]-a[1])*p.p-2,4,4)});NODES.forEach((n,i)=>{const hl=S.hl===n&&Date.now()<S.hlT;x.fillStyle=hl?'#f33':'#0b0b10';x.strokeStyle=hl?'#f33':'#39ff88';x.lineWidth=hl?3:1.5;x.beginPath();x.arc(pos[i][0],pos[i][1],i?20:28,0,6.28);x.fill();x.stroke();x.fillStyle='#fff';x.font='9px monospace';x.textAlign='center';x.fillText(n,pos[i][0],pos[i][1]+3)})};c.c.onclick=e=>{const r=c.c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;pos.forEach((p,i)=>{if(Math.hypot(p[0]-mx,p[1]-my)<26){sfx.ping();dp('NODE '+NODES[i],[['STATE','ONLINE'],['LOAD',(rr(10,70)|0)+'%'],['THROUGHPUT',(rr(100,900)|0)+' u/s'],['LINKS',i?2:8],['TEMP',(rr(30,50)|0)+'C']])}})}}
/* FLOW */
function flow(){const c=mk('#c1');if(!c)return;const L=['SOURCE','CHANNEL','PROTOCOL','ENCRYPTION','DESTINATION'],ps=Array.from({length:60},()=>({l:R()*3|0,p:R()}));anim=t=>{const{x,w,h}=c;x.clearRect(0,0,w,h);const sx=i=>40+i*(w-80)/4;L.forEach((n,i)=>{x.strokeStyle='rgba(193,18,31,.8)';x.strokeRect(sx(i)-24,h/2-70,48,140);x.fillStyle='#fff';x.font='9px monospace';x.textAlign='center';x.fillText(n,sx(i),h/2-78)});for(let l=0;l<3;l++){x.strokeStyle='rgba(57,255,136,.2)';x.beginPath();x.moveTo(sx(0),h/2-40+l*40);x.lineTo(sx(4),h/2-40+l*40);x.stroke()}ps.forEach(p=>{p.p=(p.p+.004*(1+S.spike))%1;x.fillStyle=p.p>.5?'#39ff88':'#ff4d5a';x.shadowColor=x.fillStyle;x.shadowBlur=8;x.beginPath();x.arc(sx(0)+p.p*(sx(4)-sx(0)),h/2-40+p.l*40,2.5,0,6.28);x.fill();x.shadowBlur=0})};c.c.onclick=e=>{const r=c.c.getBoundingClientRect(),i=Math.round((e.clientX-r.left-40)/((c.w-80)/4));if(i>=0&&i<5){sfx.ping();dp(L[i],[['STAGE',i+1],['FLOW',(rr(100,900)|0)+' u/s'],['STATUS','ACTIVE'],['INTEGRITY','VERIFIED']])}}}
/* SCOPE */
let SF=2,SN=false;function scope(){const c=mk('#c1');if(!c)return;anim=t=>{const{x,w,h}=c;x.clearRect(0,0,w,h);x.strokeStyle='rgba(57,255,136,.12)';for(let i=0;i<w;i+=w/10){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}[['#39ff88',1],['#c1121f',1.7],['#fff',.6]].forEach((o,k)=>{x.strokeStyle=o[0];x.beginPath();for(let i=0;i<w;i+=3){const y=h*(.2+k*.3)+Math.sin(i*.03*SF*o[1]+t*3*o[1])*h*.08*(1+S.spike*.3)+(SN?(R()-.5)*14:0);i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()})};const f=()=>{const e=$('#sr');if(!e)return;e.innerHTML=[['SIGNAL STRENGTH',rr(80,99).toFixed(1)+'%'],['FREQUENCY',(SF*2.4).toFixed(1)+' GHz-SIM'],['NOISE',SN?'HIGH':'LOW'],['STABILITY',rr(94,99).toFixed(1)+'%'],['PATTERN',SN?'IRREGULAR':'STABLE']].map(a=>'<div class="pan"><div class="lab">'+a[0]+'</div>'+a[1]+'</div>').join('');setTimeout(f,1000)};f()}

function enc(){const c=mk('#c1');if(!c)return;anim=t=>{const{x,w,h}=c;x.clearRect(0,0,w,h);const n=Math.floor(w/22);for(let r=0;r<10;r++)for(let i=0;i<n;i++){const p=(i/n+t*.1)%1,e=p>.5;x.fillStyle=e?'rgba(57,255,136,'+(.3+.5*Math.abs(Math.sin(i*r+t*2)))+')':'rgba(255,255,255,.55)';const y=r*24+10+(e?Math.sin(i+t*3)*4:0);x.fillRect(i*22,y,e?8+((i*r)%3)*3:18,e?4:12)}}}

const PH=[['INITIALIZATION',0,'Security protocols are initializing.'],['ENVIRONMENT ANALYSIS',200,'System environment analysis has begun.'],['ARCHITECTURE MAPPING',270,'Security architecture mapping is complete.'],['SECURITY MONITORING',140,'Monitoring protocols are now active.'],['SIGNAL ANALYSIS',40,'Threat analysis is in progress.'],['PROTOCOL SYNCHRONIZATION',300,'Protocol synchronization is underway.'],['SYSTEM STABILIZATION',120,'Protocol stabilization initiated.']];
async function sequence(){if(S.busy)return;S.busy=1;initAudio();const o=$('#ov');o.style.display='flex';document.body.classList.add('hh');for(let i=0;i<7;i++){const p=PH[i];document.documentElement.style.setProperty('--a','hsl('+p[1]+',80%,42%)');o.innerHTML='<div class="lab">PHASE 0'+(i+1)+'</div><div class="big" style="font-size:clamp(22px,6vw,46px)">'+p[0]+'</div><div class="pb"><i id="pi"></i></div><div class="sub" style="color:var(--g)" id="pl"></div>';setTimeout(()=>{$('#pi').style.width='100%'},50);[sfx.boot,sfx.scan,sfx.enc,sfx.ping,sfx.sig,sfx.proto,sfx.ok][i]();speak(p[2]);tp(['PHASE 0'+(i+1)+' :: '+p[0]+' '+eid()]);await sl(2600)}

async function lockdown(){if(S.busy)return;S.busy=1;initAudio();const o=$('#ov'),b=document.body;S.state='LOCKDOWN';$('#ss').textContent='SYSTEM: LOCKDOWN';o.style.display='flex';b.classList.add('c','hh');const T=['SECURITY EVENT DETECTED','ANALYZING...','VERIFYING...','ISOLATING...','STABILIZING...'];for(let i=0;i<T.length;i++){o.innerHTML='<div class="big" style="font-size:clamp(22px,6vw,52px);color:#f33">'+T[i]+'</div><div class="pb"><i id="pi"></i></div>';setTimeout(()=>{const p=$('#pi');if(p)p.style.width=(i+1)*20+'%'},50);sfx.crit();if(!S.rm){o.classList.add('shake');setTimeout(()=>o.classList.remove('shake'),450)}tp(['LOCKDOWN '+T[i]+' '+eid()]);S.tg.push({a:R()*6.28,r:rr(.3,.9),l:'SECURITY EVENT',s:'C',id:eid(),t:Date.now()});speak(['Security event detected.','Analyzing.','Verifying.','Isolating.','Stabilizing.'][i]);await sl(2000)}
o.innerHTML='<div class="big" style="font-size:clamp(22px,6vw,52px);color:var(--g)">SYSTEM STABILIZED</div>';sfx.ok();speak('System stabilized.');b.classList.remove('c');await sl(1800);o.style.display='none';b.classList.remove('hh');S.state='NOMINAL';$('#ss').textContent='SYSTEM: NOMINAL';award('COMMAND OPERATOR');S.busy=0}
